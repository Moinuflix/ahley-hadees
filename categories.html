<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Categories — Ahley Hadees</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+Tamil:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: "Plus Jakarta Sans", "Noto Sans Tamil", sans-serif;
      -webkit-tap-highlight-color: transparent;
      background: #050811;
      color: #f1f5f9;
      overflow-x: hidden;
    }
    .font-serif-title { font-family: "Cinzel", serif; }

    /* Holographic Category Card */
    .holo-cat-card {
      position: relative;
      width: 290px;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(145deg, #180d05 0%, #0c0804 100%);
      border: 1px solid rgba(245, 158, 11, 0.35);
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.85);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }
    .holo-cat-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(245, 158, 11, 0.7);
      box-shadow: 0 25px 50px -10px rgba(245, 158, 11, 0.25);
    }
    .holo-cat-card::after {
      content: "";
      position: absolute;
      inset: -50%;
      background: linear-gradient(115deg, transparent 20%, rgba(255, 255, 255, 0.15) 45%, rgba(245, 158, 11, 0.25) 50%, transparent 70%);
      transform: rotate(25deg) translateY(-100%);
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .holo-cat-card:hover::after {
      transform: rotate(25deg) translateY(100%);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-950">

  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[750px] h-[380px] bg-amber-600/10 blur-3xl rounded-full"></div>
    <div class="absolute bottom-0 right-0 w-[450px] h-[450px] bg-red-950/20 blur-3xl rounded-full"></div>
  </div>

  <header class="sticky top-0 z-40 border-b border-slate-800/80 bg-[#050811]/90 backdrop-blur-xl px-4 lg:px-8 py-3.5">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-400 to-amber-200 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-amber-500/20 text-base shrink-0">AH</div>
        <div>
          <h1 class="text-sm lg:text-base font-extrabold tracking-tight text-white flex items-center gap-2">
            Ahley Hadees <span class="text-[10px] bg-amber-500/15 text-amber-300 font-bold px-2 py-0.5 rounded-full border border-amber-500/30">RESEARCH</span>
          </h1>
        </div>
      </div>
      <a href="index.html" class="px-3.5 py-1.5 text-xs font-bold rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 transition">← Back to Library</a>
    </div>
  </header>

  <main class="max-w-6xl w-full mx-auto px-4 lg:px-8 py-6 lg:py-10 flex-1">
    
    <div class="max-w-2xl mx-auto text-center mb-8">
      <h2 id="section-title" class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-white to-slate-200 font-serif-title tracking-wide mb-2">
        Categories
      </h2>
      <p id="section-subtitle" class="text-xs sm:text-sm text-slate-400">
        ஆய்வுத் தொகுப்பைத் தேர்ந்தெடுத்து தலைப்புகளுக்குச் செல்லவும்.
      </p>
    </div>

    <!-- Navigation Breadcrumbs -->
    <div class="max-w-xl mx-auto mb-8 flex items-center justify-between gap-2 bg-slate-900/60 backdrop-blur border border-slate-800/80 rounded-2xl p-2.5 px-4 text-xs">
      <div class="text-slate-300 font-medium">
        <a href="index.html" class="hover:text-amber-400 transition">Library</a>
        <span class="mx-2 text-slate-600">/</span>
        <span id="active-section-label" class="text-amber-400 font-bold">Bible</span>
      </div>
      <a href="index.html" class="text-xs font-bold text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1 rounded-xl transition">← Home</a>
    </div>

    <!-- Categories Grid -->
    <div id="categories-grid" class="flex flex-wrap items-center justify-center gap-8 py-6"></div>
  </main>

  <footer class="border-t border-slate-900 py-5 text-center text-xs text-slate-600">
    Ahley Hadees Research Library • Step 2: Categories Hub
  </footer>

  <script src="js/data.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const sectionName = urlParams.get("section") || "Bible";

    const sectionTitle = document.getElementById("section-title");
    const sectionSubtitle = document.getElementById("section-subtitle");
    const activeSectionLabel = document.getElementById("active-section-label");
    const categoriesGrid = document.getElementById("categories-grid");

    document.addEventListener("DOMContentLoaded", async () => {
      const allTopics = await getTopics();
      const filtered = allTopics.filter(t => t.section.toLowerCase() === sectionName.toLowerCase());

      sectionTitle.textContent = `${sectionName} Categories`;
      sectionSubtitle.textContent = `${sectionName} பிரிவின் கீழ் உள்ள ஆய்வுத் தொகுப்பைத் தேர்ந்தெடுக்கவும்.`;
      activeSectionLabel.textContent = sectionName;

      const categories = [...new Set(filtered.map(t => t.category))];

      if (categories.length === 0) {
        categoriesGrid.innerHTML = `
          <div class="bg-slate-900/60 p-8 rounded-3xl text-center border border-slate-800 max-w-sm">
            <p class="text-slate-400 text-sm">No categories added yet for ${sectionName}.</p>
          </div>
        `;
        return;
      }

      categoriesGrid.innerHTML = categories.map(cat => {
        const count = filtered.filter(t => t.category === cat).length;
        return `
          <div class="holo-cat-card p-6 group" onclick="openCategory('${cat}')">
            <div class="h-36 rounded-2xl bg-gradient-to-tr from-amber-950 via-slate-900 to-amber-900 flex items-center justify-center border border-amber-500/30 relative overflow-hidden mb-5">
              <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-amber-500/20 to-transparent"></div>
              <div class="w-16 h-16 rounded-2xl border-2 border-amber-400/40 bg-amber-950/80 flex items-center justify-center text-3xl shadow-xl shadow-amber-950">
                📁
              </div>
              <span class="absolute top-3 right-3 text-[10px] font-bold text-amber-300 bg-black/60 px-2.5 py-0.5 rounded-full border border-amber-400/30">
                ${count} தலைப்புகள்
              </span>
            </div>

            <h3 class="font-serif-title text-xl font-black text-white group-hover:text-amber-300 transition-colors">
              ${cat}
            </h3>
            <p class="text-xs text-amber-400 font-semibold mt-1">சரிபார்க்கப்பட்ட ஒப்பாய்வு தொகுப்பு</p>
            <p class="text-xs text-slate-300 mt-2 line-clamp-2 leading-relaxed">
              முக்கிய தீர்க்கதரிசன வசனங்கள், மொழிபெயர்ப்பு ஒப்பீடுகள் மற்றும் ஆய்வு குறிப்புகள்.
            </p>

            <button class="mt-5 w-full py-2.5 rounded-xl bg-amber-500/20 group-hover:bg-amber-600 text-amber-300 group-hover:text-slate-950 border border-amber-500/40 font-bold text-xs transition flex items-center justify-center gap-1.5">
              <span>தலைப்புகளைத் திறக்க</span>
              <span>வாசி →</span>
            </button>
          </div>
        `;
      }).join("");
    });

    function openCategory(cat) {
      window.location.href = `topics.html?section=${encodeURIComponent(sectionName)}&category=${encodeURIComponent(cat)}`;
    }
  </script>
</body>
</html>
