<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic Study Details</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Ahley Hadees Research Portal</h1>
    <div class="nav-links">
      <a href="index.html">← Back to Topics</a>
      <a href="admin.html">Admin</a>
    </div>
  </header>

  <div class="container">
    <div id="topic-content" class="study-box">
      <!-- Dynamic content loads here -->
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const topicId = params.get('id');
      const topics = await getTopics();
      const topic = topics.find(t => t.id === topicId);

      const contentBox = document.getElementById('topic-content');

      if (!topic) {
        contentBox.innerHTML = `<h2>Topic not found.</h2><a href="index.html">Go to Home</a>`;
        return;
      }

      contentBox.innerHTML = `
        <span class="badge">${topic.section} / ${topic.category}</span>
        <h2 style="margin: 0.5rem 0;">${topic.title}</h2>
        <p><strong>Verse Reference:</strong> ${topic.verseRef}</p>
        
        <div class="section-label">Biblical / Classical Tamil Text:</div>
        <div class="tamil-text">${topic.classicalTamil || 'N/A'}</div>

        <div class="section-label">Modern Tamil Explanation:</div>
        <div class="tamil-text" style="border-left-color: #0284c7;">${topic.modernTamil || 'N/A'}</div>

        <div class="section-label">Research Question:</div>
        <p style="font-weight: 600; font-size: 1.1rem; color: #b91c1c;">${topic.question}</p>

        <div class="section-label">Model Answer:</div>
        <div class="answer-box">${topic.answer}</div>

        <div class="section-label">Sources / References:</div>
        <p style="color: var(--text-muted);">${topic.sources}</p>
      `;
    });
  </script>
</body>
</html>
