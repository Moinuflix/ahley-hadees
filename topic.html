<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>வேத ஆராய்ச்சி - Verse Study Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 pb-28">

  <!-- Sticky Top Header (Responsive Container) -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-4 lg:px-8 py-3 shadow-sm">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg border border-indigo-100 transition">
          ← Library
        </a>
        <h1 id="top-title" class="text-sm lg:text-base font-bold text-slate-900 truncate max-w-xs lg:max-w-md">வேத ஆராய்ச்சி</h1>
      </div>
      <span id="top-ref" class="text-xs lg:text-sm font-mono font-semibold text-slate-700 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
        Loading...
      </span>
    </div>
  </header>

  <!-- Banner (Full Width Desktop / Centered) -->
  <div class="max-w-6xl mx-auto px-4 lg:px-8 pt-6">
    <div class="bg-gradient-to-r from-indigo-700 via-indigo-600 to-indigo-800 text-white rounded-2xl p-6 shadow-md flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2 text-xs text-indigo-200 mb-2 font-medium">
          <span class="bg-indigo-500/40 px-2.5 py-0.5 rounded-md">Verse by Verse Research</span>
          <span id="verse-count-badge" class="bg-white/20 px-2.5 py-0.5 rounded-md font-semibold text-white">0 வசனங்கள்</span>
        </div>
        <h2 id="banner-title" class="text-xl lg:text-2xl font-bold">Research Title</h2>
        <p id="banner-desc" class="text-xs lg:text-sm text-indigo-100 mt-1 opacity-90 max-w-2xl">
          ஒவ்வொரு வசனத்திற்கும் கீழே எளிய தமிழ், வினா மற்றும் விடை எழுதும் வசதி இணைக்கப்பட்டுள்ளது.
        </p>
      </div>
    </div>
  </div>

  <!-- Responsive Study Grid (Mobile: Stacked, PC: 2 Columns) -->
  <main id="verses-list" class="max-w-6xl mx-auto p-4 lg:px-8 space-y-6">
    <!-- Dynamic Cards Will Render Here -->
  </main>

  <!-- Floating Save Button -->
  <div class="fixed bottom-0 left-0 right-0 p-3 bg-white/95 backdrop-blur border-t border-slate-200 z-20 shadow-lg">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4 px-2 lg:px-4">
      <span class="hidden md:inline text-xs font-medium text-slate-500">
        Type your research insights and click save to keep your answers locally.
      </span>
      <button onclick="saveAllAnswers()" class="w-full md:w-auto px-8 py-3 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white text-xs lg:text-sm font-bold rounded-xl shadow transition">
        💾 எல்லா பதில்களையும் சேமி (Save Answers)
      </button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    let currentTopicData = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const topicId = params.get('id');
      const topics = await getTopics();
      currentTopicData = topics.find(t => t.id === topicId) || topics[0];

      if (!currentTopicData) {
        document.getElementById('verses-list').innerHTML = `
          <div class="text-center p-8 bg-white rounded-2xl border border-slate-200">
            <p class="text-slate-500 text-sm">Topic not found.</p>
            <a href="index.html" class="inline-block mt-3 text-xs font-bold text-indigo-600">Go to Home</a>
          </div>
        `;
        return;
      }

      document.getElementById('top-title').textContent = currentTopicData.title;
      document.getElementById('top-ref').textContent = currentTopicData.chapterRef || '';
      document.getElementById('banner-title').textContent = currentTopicData.title;
      if (currentTopicData.headerNote) {
        document.getElementById('banner-desc').textContent = currentTopicData.headerNote;
      }
      
      const verses = currentTopicData.verses || [];
      document.getElementById('verse-count-badge').textContent = `${verses.length} வசனங்கள்`;

      const mainContainer = document.getElementById('verses-list');
      const savedAnswers = JSON.parse(localStorage.getItem(`answers_${currentTopicData.id}`) || '{}');

      mainContainer.innerHTML = verses.map((item, index) => `
        <section class="bg-white rounded-2xl p-5 lg:p-6 shadow-sm border border-slate-200">
          
          <!-- Card Header Bar -->
          <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
            <span class="text-xs lg:text-sm font-bold text-indigo-700 bg-indigo-50 px-3 py-1 rounded-md border border-indigo-100">
              ${item.verseNum}
            </span>
            <span class="text-xs text-slate-400 font-semibold">பகுதி #${index + 1}</span>
          </div>

          <!-- Desktop: Side by Side (2-Columns), Mobile: Stacked (1-Column) -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 lg:gap-6">
            
            <!-- Left Side: Texts (Scripture + Modern Translation) -->
            <div class="space-y-4">
              <!-- Biblical/Original -->
              <div class="bg-amber-50/70 border-l-4 border-amber-500 rounded-r-xl p-3.5">
                <p class="text-[11px] font-bold text-amber-900 uppercase tracking-wide mb-1 flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                  Original / Biblical Text (வசனம்)
                </p>
                <p class="text-sm lg:text-base text-amber-950 font-serif leading-relaxed">
                  "${item.biblical}"
                </p>
              </div>

              <!-- Modern Tamil -->
              <div class="bg-emerald-50/70 border-l-4 border-emerald-500 rounded-r-xl p-3.5">
                <p class="text-[11px] font-bold text-emerald-900 uppercase tracking-wide mb-1 flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                  Modern Tamil (எளிய தமிழ் நடை)
                </p>
                <p class="text-sm lg:text-base text-emerald-950 leading-relaxed">
                  ${item.modern}
                </p>
              </div>
            </div>

            <!-- Right Side: Research QA + Answer Box -->
            <div class="space-y-3.5 flex flex-col justify-between">
              
              <!-- Question Box -->
              <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5">
                <p class="text-[11px] font-bold text-indigo-700 uppercase tracking-wide mb-1">
                  ❓ ஆய்வு வினா (Research Question)
                </p>
                <p class="text-sm lg:text-base font-semibold text-slate-800">
                  ${item.question}
                </p>
              </div>

              <!-- User Answer Box -->
              <div class="space-y-2">
                <label class="block text-xs font-semibold text-slate-700">
                  ✍️ உங்கள் பதில் (Your Research Notes):
                </label>
                <textarea 
                  id="user-ans-${index}"
                  rows="3" 
                  placeholder="இங்கே உங்கள் பதிலை டைப் செய்யலாம்..." 
                  class="w-full text-xs lg:text-sm p-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white shadow-inner"
                >${savedAnswers[index] || ''}</textarea>

                <!-- Model Answer Accordion -->
                <details class="group bg-slate-50 border border-slate-200 rounded-xl p-3">
                  <summary class="flex justify-between items-center text-xs font-bold text-indigo-700 cursor-pointer list-none select-none">
                    <span>💡 சரியான விளக்கம் / பதில் பார்க்க (Show Model Answer)</span>
                    <span class="text-xs transition-transform group-open:rotate-180">▾</span>
                  </summary>
                  <p class="mt-2 text-xs lg:text-sm text-slate-700 bg-white p-3 rounded-lg border border-slate-100 leading-relaxed">
                    <strong>பதில்:</strong> ${item.defaultAnswer}
                  </p>
                </details>
              </div>

            </div>

          </div>

        </section>
      `).join('');
    });

    function saveAllAnswers() {
      if (!currentTopicData || !currentTopicData.verses) return;
      const savedMap = {};
      currentTopicData.verses.forEach((_, index) => {
        const el = document.getElementById(`user-ans-${index}`);
        if (el) savedMap[index] = el.value;
      });
      localStorage.setItem(`answers_${currentTopicData.id}`, JSON.stringify(savedMap));
      alert("✅ பதில்கள் வெற்றிகரமாக சேமிக்கப்பட்டன! (Saved locally)");
    }
  </script>
</body>
</html>
