<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>வேத ஆராய்ச்சி - Multi-Version Study</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .tab-btn.active { background-color: #4f46e5; color: #fff; border-color: #4f46e5; }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 pb-28">
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-4 lg:px-8 py-3 shadow-sm">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg border border-indigo-100 transition">← Library</a>
        <h1 id="top-title" class="text-sm lg:text-base font-bold text-slate-900 truncate max-w-xs lg:max-w-md">வேத ஆராய்ச்சி</h1>
      </div>
      <span id="top-ref" class="text-xs lg:text-sm font-mono font-semibold text-slate-700 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">Loading...</span>
    </div>
  </header>

  <div class="max-w-6xl mx-auto px-4 lg:px-8 pt-6">
    <div class="bg-gradient-to-r from-indigo-700 via-indigo-600 to-indigo-800 text-white rounded-2xl p-6 shadow-md">
      <div class="flex items-center gap-2 text-xs text-indigo-200 mb-2 font-medium">
        <span class="bg-indigo-500/40 px-2.5 py-0.5 rounded-md">Comparative Verse Study</span>
        <span id="verse-count-badge" class="bg-white/20 px-2.5 py-0.5 rounded-md font-semibold text-white">0 வசனங்கள்</span>
      </div>
      <h2 id="banner-title" class="text-xl lg:text-2xl font-bold">Research Title</h2>
      <p id="banner-desc" class="text-xs lg:text-sm text-indigo-100 mt-1 opacity-90 max-w-2xl">ஒவ்வொரு வசனத்திற்கும் BSI, RC, யெகோவா பதிப்புகள் மற்றும் வினா-விடை ஒப்பீடு.</p>
    </div>
  </div>

  <main id="verses-list" class="max-w-6xl mx-auto p-4 lg:px-8 space-y-6"></main>

  <div class="fixed bottom-0 left-0 right-0 p-3 bg-white/95 backdrop-blur border-t border-slate-200 z-20 shadow-lg">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4 px-2 lg:px-4">
      <span class="hidden md:inline text-xs font-medium text-slate-500">Type your research insights and click save to keep your answers locally.</span>
      <button onclick="saveAllAnswers()" class="w-full md:w-auto px-8 py-3 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white text-xs lg:text-sm font-bold rounded-xl shadow transition">💾 எல்லா பதில்களையும் சேமி (Save Answers)</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    let currentTopicData = null;
    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      const topicId = params.get("id");
      const topics = await getTopics();
      currentTopicData = topics.find(t => t.id === topicId) || topics[0];

      if (!currentTopicData) {
        document.getElementById("verses-list").innerHTML = `<div class="text-center p-8 bg-white rounded-2xl border border-slate-200"><p class="text-slate-500 text-sm">Topic not found.</p><a href="index.html" class="inline-block mt-3 text-xs font-bold text-indigo-600">Go to Home</a></div>`;
        return;
      }

      document.getElementById("top-title").textContent = currentTopicData.title;
      document.getElementById("top-ref").textContent = currentTopicData.chapterRef || "";
      document.getElementById("banner-title").textContent = currentTopicData.title;
      if (currentTopicData.headerNote) document.getElementById("banner-desc").textContent = currentTopicData.headerNote;
      
      const verses = currentTopicData.verses || [];
      document.getElementById("verse-count-badge").textContent = `${verses.length} வசனங்கள்`;

      const mainContainer = document.getElementById("verses-list");
      const savedAnswers = JSON.parse(localStorage.getItem(`answers_${currentTopicData.id}`) || "{}");

      mainContainer.innerHTML = verses.map((item, index) => {
        const bsi = item.bsiTamil || item.biblical || "தரவு இல்லை";
        const rc = item.rcTamil || "RC திருவிவிலியப் பதிவு சேர்க்கப்படவில்லை.";
        const jw = item.jwTamil || "யெகோவா சாட்சிகள் பதிவு சேர்க்கப்படவில்லை.";
        const modern = item.modern || "எளிய தமிழ் விளக்கம் சேர்க்கப்படவில்லை.";
        const hasAnswer = item.defaultAnswer && item.defaultAnswer.trim().length > 0;

        return `
          <section class="bg-white rounded-2xl p-5 lg:p-6 shadow-sm border border-slate-200">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
              <span class="text-xs lg:text-sm font-bold text-indigo-700 bg-indigo-50 px-3 py-1 rounded-md border border-indigo-100">${item.verseNum}</span>
              <span class="text-xs text-slate-400 font-semibold">பகுதி #${index + 1}</span>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 lg:gap-6">
              <div class="space-y-3">
                <div class="flex flex-wrap gap-1.5 border-b border-slate-100 pb-2">
                  <button onclick="switchTab(${index}, 'bsi')" id="tab-${index}-bsi" class="tab-btn active text-[11px] font-bold px-2.5 py-1 rounded-lg border border-slate-200 text-slate-600 transition">BSI (புரொட்டஸ்டன்ட்)</button>
                  <button onclick="switchTab(${index}, 'rc')" id="tab-${index}-rc" class="tab-btn text-[11px] font-bold px-2.5 py-1 rounded-lg border border-slate-200 text-slate-600 transition">RC (திருவிவிலியம்)</button>
                  <button onclick="switchTab(${index}, 'jw')" id="tab-${index}-jw" class="tab-btn text-[11px] font-bold px-2.5 py-1 rounded-lg border border-slate-200 text-slate-600 transition">யெகோவா (NWT)</button>
                  <button onclick="switchTab(${index}, 'modern')" id="tab-${index}-modern" class="tab-btn text-[11px] font-bold px-2.5 py-1 rounded-lg border border-slate-200 text-slate-600 transition">Modern தமிழ்</button>
                </div>

                <div id="content-${index}-bsi" class="tab-content bg-amber-50/70 border-l-4 border-amber-500 rounded-r-xl p-3.5">
                  <p class="text-[10px] font-bold text-amber-900 uppercase tracking-wide mb-1">BSI Vedhagamam Text</p>
                  <p class="text-sm lg:text-base text-amber-950 font-serif leading-relaxed">"${bsi}"</p>
                </div>
                <div id="content-${index}-rc" class="tab-content hidden bg-sky-50/70 border-l-4 border-sky-500 rounded-r-xl p-3.5">
                  <p class="text-[10px] font-bold text-sky-900 uppercase tracking-wide mb-1">RC Thiruviviliam Text</p>
                  <p class="text-sm lg:text-base text-sky-950 leading-relaxed">"${rc}"</p>
                </div>
                <div id="content-${index}-jw" class="tab-content hidden bg-purple-50/70 border-l-4 border-purple-500 rounded-r-xl p-3.5">
                  <p class="text-[10px] font-bold text-purple-900 uppercase tracking-wide mb-1">Jehovah NWT Text</p>
                  <p class="text-sm lg:text-base text-purple-950 leading-relaxed">"${jw}"</p>
                </div>
                <div id="content-${index}-modern" class="tab-content hidden bg-emerald-50/70 border-l-4 border-emerald-500 rounded-r-xl p-3.5">
                  <p class="text-[10px] font-bold text-emerald-900 uppercase tracking-wide mb-1">Simple / Modern Tamil Explanation</p>
                  <p class="text-sm lg:text-base text-emerald-950 leading-relaxed">${modern}</p>
                </div>
              </div>

              <div class="space-y-3.5 flex flex-col justify-between">
                <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5">
                  <p class="text-[11px] font-bold text-indigo-700 uppercase tracking-wide mb-1">❓ ஆய்வு வினா (Research Question)</p>
                  <p class="text-sm lg:text-base font-semibold text-slate-800">${item.question || "ஆய்வு வினா சேர்க்கப்படவில்லை."}</p>
                </div>

                <div class="space-y-2">
                  <label class="block text-xs font-semibold text-slate-700">✍️ உங்கள் பதில் (Your Research Notes):</label>
                  <textarea id="user-ans-${index}" rows="3" placeholder="இங்கே உங்கள் பதிலை டைப் செய்யலாம்..." class="w-full text-xs lg:text-sm p-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white shadow-inner">${savedAnswers[index] || ""}</textarea>
                  ${hasAnswer ? `
                    <details class="group bg-slate-50 border border-slate-200 rounded-xl p-3">
                      <summary class="flex justify-between items-center text-xs font-bold text-indigo-700 cursor-pointer list-none select-none">
                        <span>💡 சரியான விளக்கம் / பதில் பார்க்க (Show Model Answer)</span>
                        <span class="text-xs transition-transform group-open:rotate-180">▾</span>
                      </summary>
                      <p class="mt-2 text-xs lg:text-sm text-slate-700 bg-white p-3 rounded-lg border border-slate-100 leading-relaxed"><strong>பதில்:</strong> ${item.defaultAnswer}</p>
                    </details>` : `<p class="text-[11px] text-slate-400 italic">குறிப்பு: இந்த வசனத்திற்கு மாதிரி விடை இன்னும் பதிவு செய்யப்படவில்லை.</p>`}
                </div>
              </div>
            </div>
          </section>`;
      }).join("");
    });

    function switchTab(cardIndex, versionKey) {
      ["bsi", "rc", "jw", "modern"].forEach(v => {
        const btn = document.getElementById(`tab-${cardIndex}-${v}`);
        const content = document.getElementById(`content-${cardIndex}-${v}`);
        if (v === versionKey) {
          btn.classList.add("active");
          content.classList.remove("hidden");
        } else {
          btn.classList.remove("active");
          content.classList.add("hidden");
        }
      });
    }

    function saveAllAnswers() {
      if (!currentTopicData || !currentTopicData.verses) return;
      const savedMap = {};
      currentTopicData.verses.forEach((_, index) => {
        const el = document.getElementById(`user-ans-${index}`);
        if (el) savedMap[index] = el.value;
      });
      localStorage.setItem(`answers_${currentTopicData.id}`, JSON.stringify(savedMap));
      alert("✅ பதில்கள் வெற்றிகரமாக சேமிக்கப்பட்டன! (Saved locally)");
    }
  </script>
</body>
</html>
