<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>வேத ஆராய்ச்சி - Comparative Study</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Plus Jakarta Sans", "Noto Sans Tamil", sans-serif; -webkit-tap-highlight-color: transparent; }
    .floating-sheet {
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-32 selection:bg-indigo-500 selection:text-white">

  <!-- Minimal Header (Clean, No bulky boxes) -->
  <header class="sticky top-0 z-30 bg-slate-950/85 backdrop-blur-md border-b border-slate-800/80 px-4 lg:px-8 py-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-xs font-bold uppercase tracking-wider text-indigo-400 bg-indigo-500/10 hover:bg-indigo-500/20 px-3 py-1.5 rounded-xl border border-indigo-500/20 transition shrink-0">
          ← Library
        </a>
        <h1 id="top-title" class="text-sm font-bold text-white truncate max-w-[200px] sm:max-w-md">வேத ஆராய்ச்சி</h1>
      </div>
      <span id="top-ref" class="text-xs font-mono font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-lg border border-emerald-500/20 shrink-0">
        ...
      </span>
    </div>
  </header>

  <!-- Topic Hero Banner -->
  <div class="max-w-4xl mx-auto px-4 lg:px-8 pt-6">
    <div class="bg-gradient-to-br from-slate-900 to-indigo-950/40 border border-slate-800 rounded-3xl p-6 shadow-xl relative overflow-hidden">
      <div class="flex items-center gap-2 text-xs text-indigo-300 mb-2 font-medium">
        <span class="bg-indigo-500/20 border border-indigo-500/30 text-indigo-300 px-2.5 py-0.5 rounded-md font-semibold">Comparative Study</span>
        <span id="verse-count-badge" class="bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded-md font-bold">0 வசனங்கள்</span>
      </div>
      <h2 id="banner-title" class="text-xl sm:text-2xl font-black text-white tracking-tight">Research Title</h2>
      <p id="banner-desc" class="text-xs sm:text-sm text-slate-400 mt-1 leading-relaxed">
        ஒவ்வொரு வசனத்தையும் கிளிக் செய்து எளிய தமிழ் விளக்கத்தைப் பெறலாம்.
      </p>
    </div>
  </div>

  <!-- Main Verse Cards List -->
  <main id="verses-list" class="max-w-4xl mx-auto p-4 lg:px-8 space-y-6 pt-6"></main>

  <!-- Floating Floating Action Controls (Right Corner Pill + Save Bar) -->
  <div class="fixed bottom-5 right-5 z-40 flex flex-col items-end gap-3">
    
    <!-- Floating Version Switcher Pill -->
    <button onclick="toggleLangSheet()" class="group flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-2xl shadow-indigo-600/50 border border-indigo-400/30 transition-all">
      <span class="text-sm">🌐</span>
      <span id="floating-btn-label">BSI வேதாமம்</span>
      <span class="text-[10px] opacity-75">▾</span>
    </button>

    <!-- Save Button Pill -->
    <button onclick="saveAllAnswers()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-2xl shadow-emerald-600/40 border border-emerald-400/30 transition-all">
      <span>💾</span>
      <span>சேமி (Save)</span>
    </button>
  </div>

  <!-- Bottom Sheet / Modal Overlay for Language Selection -->
  <div id="lang-overlay" onclick="toggleLangSheet()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity"></div>

  <!-- Slide-up Language Bottom Sheet -->
  <div id="lang-sheet" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900 border-t border-slate-800 rounded-t-3xl p-6 z-50 transform translate-y-full opacity-0 floating-sheet">
    <div class="w-12 h-1 bg-slate-700 rounded-full mx-auto mb-4"></div>
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-sm font-bold text-white flex items-center gap-2">
        <span>🌐</span> பைபிள் பதிப்பைத் தேர்ந்தெடுக்கவும்
      </h3>
      <button onclick="toggleLangSheet()" class="text-xs text-slate-400 hover:text-white">✕ மூடு</button>
    </div>

    <div class="space-y-2">
      <button onclick="selectVersion('bsi')" id="opt-bsi" class="w-full text-left p-3.5 rounded-2xl border border-slate-800 hover:border-indigo-500/50 bg-slate-950 flex items-center justify-between transition">
        <div>
          <p class="text-xs font-bold text-white">BSI வேதாமம் (Protestant)</p>
          <p class="text-[11px] text-slate-400">பாரம்பரிய தமிழ் மொழிபெயர்ப்பு</p>
        </div>
        <span class="check-icon text-indigo-400 text-sm font-bold">✓</span>
      </button>

      <button onclick="selectVersion('rc')" id="opt-rc" class="w-full text-left p-3.5 rounded-2xl border border-slate-800 hover:border-indigo-500/50 bg-slate-950 flex items-center justify-between transition">
        <div>
          <p class="text-xs font-bold text-white">RC திருவிவிலியம் (Catholic)</p>
          <p class="text-[11px] text-slate-400">பொது மொழிபெயர்ப்பு நடை</p>
        </div>
        <span class="check-icon hidden text-indigo-400 text-sm font-bold">✓</span>
      </button>

      <button onclick="selectVersion('jw')" id="opt-jw" class="w-full text-left p-3.5 rounded-2xl border border-slate-800 hover:border-indigo-500/50 bg-slate-950 flex items-center justify-between transition">
        <div>
          <p class="text-xs font-bold text-white">யெகோவா சாட்சிகள் (NWT)</p>
          <p class="text-[11px] text-slate-400">புதிய உலக மொழிபெயர்ப்பு</p>
        </div>
        <span class="check-icon hidden text-indigo-400 text-sm font-bold">✓</span>
      </button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    let currentTopicData = null;
    let selectedVersion = "bsi";

    const versionNames = {
      bsi: "BSI வேதாமம்",
      rc: "RC திருவிவிலியம்",
      jw: "யெகோவா (NWT)"
    };

    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      const topicId = params.get("id");
      const topics = await getTopics();
      currentTopicData = topics.find(t => t.id === topicId) || topics[0];

      if (!currentTopicData) {
        document.getElementById("verses-list").innerHTML = `
          <div class="text-center p-8 bg-slate-900 rounded-3xl border border-slate-800">
            <p class="text-slate-400 text-sm">Topic not found.</p>
            <a href="index.html" class="inline-block mt-3 text-xs font-bold text-indigo-400">Go to Home</a>
          </div>
        `;
        return;
      }

      document.getElementById("top-title").textContent = currentTopicData.title;
      document.getElementById("top-ref").textContent = currentTopicData.chapterRef || "";
      document.getElementById("banner-title").textContent = currentTopicData.title;
      if (currentTopicData.headerNote) {
        document.getElementById("banner-desc").textContent = currentTopicData.headerNote;
      }

      const verses = currentTopicData.verses || [];
      document.getElementById("verse-count-badge").textContent = `${verses.length} வசனங்கள்`;

      renderAllVerses();
    });

    function toggleLangSheet() {
      const sheet = document.getElementById("lang-sheet");
      const overlay = document.getElementById("lang-overlay");
      const isHidden = overlay.classList.contains("hidden");

      if (isHidden) {
        overlay.classList.remove("hidden");
        requestAnimationFrame(() => {
          overlay.classList.remove("opacity-0");
          sheet.classList.remove("translate-y-full", "opacity-0");
        });
      } else {
        overlay.classList.add("opacity-0");
        sheet.classList.add("translate-y-full", "opacity-0");
        setTimeout(() => overlay.classList.add("hidden"), 200);
      }
    }

    function selectVersion(ver) {
      selectedVersion = ver;
      document.getElementById("floating-btn-label").textContent = versionNames[ver];

      ["bsi", "rc", "jw"].forEach(v => {
        const btn = document.getElementById(`opt-${v}`);
        const check = btn.querySelector(".check-icon");
        if (v === ver) {
          btn.classList.add("border-indigo-500", "bg-indigo-950/20");
          check.classList.remove("hidden");
        } else {
          btn.classList.remove("border-indigo-500", "bg-indigo-950/20");
          check.classList.add("hidden");
        }
      });

      toggleLangSheet();
      renderAllVerses();
    }

    function renderAllVerses() {
      if (!currentTopicData || !currentTopicData.verses) return;
      const mainContainer = document.getElementById("verses-list");
      const savedAnswers = JSON.parse(localStorage.getItem(`answers_${currentTopicData.id}`) || "{}");

      mainContainer.innerHTML = currentTopicData.verses.map((item, index) => {
        let currentText = "";
        if (selectedVersion === "bsi") currentText = item.bsiTamil || item.biblical || "BSI உரை சேர்க்கப்படவில்லை.";
        else if (selectedVersion === "rc") currentText = item.rcTamil || "RC திருவிவிலியப் பதிவு சேர்க்கப்படவில்லை.";
        else if (selectedVersion === "jw") currentText = item.jwTamil || "யெகோவா சாட்சிகள் பதிவு சேர்க்கப்படவில்லை.";

        const modernText = item.modern || "எளிய தமிழ் விளக்கம் சேர்க்கப்படவில்லை.";
        const answerVal = savedAnswers[index] !== undefined ? savedAnswers[index] : (item.defaultAnswer || "");

        return `
          <section class="bg-slate-900 border border-slate-800 rounded-3xl p-5 lg:p-6 shadow-xl transition-all">
            
            <div class="flex items-center justify-between border-b border-slate-800/80 pb-3 mb-4">
              <span class="text-xs sm:text-sm font-mono font-bold text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-xl border border-indigo-500/20">
                ${item.verseNum}
              </span>
              <span class="text-xs text-slate-500 font-bold">பகுதி #${index + 1}</span>
            </div>

            <!-- Verse Box (Click to reveal Modern Tamil) -->
            <div onclick="toggleModern(${index})" class="cursor-pointer group relative bg-slate-950 border border-slate-800/80 hover:border-indigo-500/40 rounded-2xl p-4 lg:p-5 transition shadow-inner">
              <div class="flex items-center justify-between mb-2">
                <span class="text-[10px] font-bold text-amber-400/90 tracking-wider uppercase flex items-center gap-1.5">
                  <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                  வேத வசனம் (Click for Modern Tamil)
                </span>
                <span id="chevron-${index}" class="text-xs text-indigo-400 font-bold transition-transform">
                  + எளிய தமிழ்
                </span>
              </div>
              
              <p class="text-sm sm:text-base text-slate-100 font-serif leading-relaxed">
                "${currentText}"
              </p>

              <!-- Modern Tamil Dropdown Drawer -->
              <div id="modern-box-${index}" class="hidden mt-4 pt-3 border-t border-slate-800 bg-emerald-950/20 border-emerald-500/30 rounded-xl p-3.5 transition-all">
                <p class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                  MODERN TAMIL (எளிய தமிழ் உரை)
                </p>
                <p class="text-xs sm:text-sm text-emerald-100 font-normal leading-relaxed">
                  ${modernText}
                </p>
              </div>
            </div>

            <!-- Question and Answer Box -->
            <div class="mt-5 space-y-3">
              <div class="bg-slate-950/70 border border-slate-800/80 rounded-2xl p-4">
                <p class="text-[11px] font-bold text-indigo-400 uppercase tracking-wide mb-1 flex items-center gap-1.5">
                  <span>❓</span> ஆய்வு வினா (RESEARCH QUESTION)
                </p>
                <p class="text-xs sm:text-sm font-semibold text-slate-200">
                  ${item.question || "ஆய்வு வினா சேர்க்கப்படவில்லை."}
                </p>
              </div>

              <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-slate-400 flex items-center gap-1.5">
                  <span>✍️</span> உங்கள் பதில் / விளக்கம்:
                </label>
                <textarea 
                  id="user-ans-${index}"
                  rows="3" 
                  placeholder="இங்கே உங்கள் பதிலை டைப் செய்யலாம்..." 
                  class="w-full text-xs sm:text-sm p-3.5 rounded-2xl border border-slate-800 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-slate-950 text-slate-200 shadow-inner resize-y leading-relaxed"
                >${answerVal}</textarea>
              </div>
            </div>

          </section>
        `;
      }).join("");
    }

    function toggleModern(index) {
      const box = document.getElementById(`modern-box-${index}`);
      const chevron = document.getElementById(`chevron-${index}`);
      if (box.classList.contains("hidden")) {
        box.classList.remove("hidden");
        chevron.textContent = "▴ மறை";
      } else {
        box.classList.add("hidden");
        chevron.textContent = "+ எளிய தமிழ்";
      }
    }

    function saveAllAnswers() {
      if (!currentTopicData || !currentTopicData.verses) return;
      const savedMap = {};
      currentTopicData.verses.forEach((_, index) => {
        const el = document.getElementById(`user-ans-${index}`);
        if (el) savedMap[index] = el.value;
      });
      localStorage.setItem(`answers_${currentTopicData.id}`, JSON.stringify(savedMap));
      alert("✅ பதில்கள் வெற்றிகரமாக சேமிக்கப்பட்டன! (Saved locally)");
    }
  </script>
</body>
</html>
