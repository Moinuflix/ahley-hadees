<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahley Hadees — Comparative Research Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', 'Noto Sans Tamil', sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }

    /* === UIVERSE 3D CARD CORE CSS === */
    .parent {
      width: 310px;
      height: 330px;
      perspective: 1000px;
      margin: 0;
    }

    .uiverse-card {
      height: 100%;
      border-radius: 46px;
      background: linear-gradient(135deg, rgb(0, 255, 214) 0%, rgb(8, 226, 96) 100%);
      transition: all 0.5s ease-in-out;
      transform-style: preserve-3d;
      box-shadow: rgba(5, 71, 17, 0) 40px 50px 25px -40px, rgba(5, 71, 17, 0.2) 0px 25px 25px -5px;
      position: relative;
      cursor: pointer;
    }

    /* Color Themes */
    .uiverse-card.theme-bible {
      background: linear-gradient(135deg, rgb(56, 189, 248) 0%, rgb(99, 102, 241) 100%);
    }
    .uiverse-card.theme-category {
      background: linear-gradient(135deg, rgb(251, 191, 36) 0%, rgb(249, 115, 22) 100%);
    }
    .uiverse-card.theme-topic {
      background: linear-gradient(135deg, rgb(168, 85, 247) 0%, rgb(79, 70, 229) 100%);
    }

    .glass {
      transform-style: preserve-3d;
      position: absolute;
      inset: 8px;
      border-radius: 50px;
      border-top-right-radius: 100%;
      background: linear-gradient(0deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.88) 100%);
      transform: translate3d(0px, 0px, 25px);
      border-left: 1px solid white;
      border-bottom: 1px solid white;
      transition: all 0.5s ease-in-out;
    }

    .content {
      padding: 85px 26px 0px 24px;
      transform: translate3d(0, 0, 26px);
      position: relative;
      z-index: 10;
    }

    .content .badge-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.8);
      margin-bottom: 6px;
      color: #065f46;
    }

    .content .title {
      display: block;
      color: #00894d;
      font-weight: 900;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: -0.3px;
    }

    .theme-bible .content .title { color: #3730a3; }
    .theme-category .content .title { color: #9a3412; }
    .theme-topic .content .title { color: #4338ca; }

    .content .text {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: rgba(15, 23, 42, 0.85);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 10px;
      font-weight: 600;
    }

    .bottom {
      padding: 10px 14px;
      transform-style: preserve-3d;
      position: absolute;
      bottom: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transform: translate3d(0, 0, 26px);
      z-index: 10;
    }

    .bottom .view-more {
      display: flex;
      align-items: center;
      width: 100%;
      justify-content: flex-end;
      gap: 4px;
      transition: all 0.2s ease-in-out;
    }

    .bottom .view-more:hover {
      transform: translate3d(0, 0, 10px);
    }

    .bottom .view-more .view-more-button {
      background: none;
      border: none;
      color: #00894d;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }

    .theme-bible .bottom .view-more .view-more-button { color: #4338ca; }
    .theme-category .bottom .view-more .view-more-button { color: #c2410c; }
    .theme-topic .bottom .view-more .view-more-button { color: #4f46e5; }

    .bottom .view-more .svg {
      fill: none;
      stroke: #00894d;
      stroke-width: 3px;
      width: 14px;
      height: 14px;
    }

    .theme-bible .bottom .view-more .svg { stroke: #4338ca; }
    .theme-category .bottom .view-more .svg { stroke: #c2410c; }
    .theme-topic .bottom .view-more .svg { stroke: #4f46e5; }

    .bottom .social-buttons-container {
      display: flex;
      gap: 6px;
      transform-style: preserve-3d;
    }

    .bottom .social-buttons-container .social-button {
      width: 28px;
      height: 28px;
      padding: 4px;
      background: rgb(255, 255, 255);
      border-radius: 50%;
      border: none;
      display: grid;
      place-content: center;
      box-shadow: rgba(0, 0, 0, 0.15) 0px 4px 5px -2px;
      cursor: pointer;
    }

    /* Circle Pop-out Layer */
    .logo {
      position: absolute;
      right: 0;
      top: 0;
      transform-style: preserve-3d;
    }

    .logo .circle {
      display: block;
      position: absolute;
      aspect-ratio: 1;
      border-radius: 50%;
      top: 0;
      right: 0;
      box-shadow: rgba(100, 100, 111, 0.2) -10px 10px 20px 0px;
      -webkit-backdrop-filter: blur(5px);
      backdrop-filter: blur(5px);
      background: rgba(0, 249, 203, 0.25);
      transition: all 0.5s ease-in-out;
    }

    .theme-bible .logo .circle { background: rgba(99, 102, 241, 0.25); }
    .theme-category .logo .circle { background: rgba(249, 115, 22, 0.25); }
    .theme-topic .logo .circle { background: rgba(168, 85, 247, 0.25); }

    .logo .circle1 { width: 170px; transform: translate3d(0, 0, 20px); top: 8px; right: 8px; }
    .logo .circle2 { width: 140px; transform: translate3d(0, 0, 40px); top: 10px; right: 10px; transition-delay: 0.1s; }
    .logo .circle3 { width: 110px; transform: translate3d(0, 0, 60px); top: 17px; right: 17px; transition-delay: 0.2s; }
    .logo .circle4 { width: 80px; transform: translate3d(0, 0, 80px); top: 23px; right: 23px; transition-delay: 0.3s; }
    .logo .circle5 {
      width: 50px;
      height: 50px;
      transform: translate3d(0, 0, 100px);
      top: 30px;
      right: 30px;
      display: grid;
      place-content: center;
      transition-delay: 0.4s;
      background: rgba(255, 255, 255, 0.35);
    }

    .logo .circle5 .icon-inner {
      font-size: 22px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    /* 3D HOVER TRIGGER */
    .parent:hover .uiverse-card {
      transform: rotate3d(1, 1, 0, 25deg);
      box-shadow: rgba(0, 0, 0, 0.3) 30px 45px 30px -30px;
    }

    .parent:hover .uiverse-card .bottom .social-buttons-container .social-button {
      transform: translate3d(0, 0, 50px);
    }

    .parent:hover .uiverse-card .logo .circle2 { transform: translate3d(0, 0, 60px); }
    .parent:hover .uiverse-card .logo .circle3 { transform: translate3d(0, 0, 80px); }
    .parent:hover .uiverse-card .logo .circle4 { transform: translate3d(0, 0, 100px); }
    .parent:hover .uiverse-card .logo .circle5 { transform: translate3d(0, 0, 125px); }
  </style>
</head>
<body class="bg-[#0b1120] text-slate-100 min-h-screen selection:bg-emerald-500 selection:text-white flex flex-col justify-between">

  <!-- Glows -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[700px] h-[350px] bg-gradient-to-b from-emerald-600/20 via-teal-500/10 to-transparent blur-3xl rounded-full"></div>
    <div class="absolute bottom-0 right-0 w-[400px] h-[400px] bg-indigo-600/15 blur-3xl rounded-full"></div>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-40 border-b border-slate-800/80 bg-[#0b1120]/80 backdrop-blur-xl px-4 lg:px-8 py-3.5">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-400 to-teal-300 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-emerald-500/30 text-lg">
          AH
        </div>
        <div>
          <h1 class="text-sm lg:text-base font-extrabold tracking-tight text-white flex items-center gap-2">
            Ahley Hadees <span class="text-[10px] bg-emerald-500/20 text-emerald-400 font-bold px-2 py-0.5 rounded-full border border-emerald-500/30">RESEARCH 3D</span>
          </h1>
          <p class="text-[10px] text-slate-400 hidden sm:block">Comparative Religious Studies & Tamil Linguistic Verification</p>
        </div>
      </div>

      <div class="flex items-center gap-2.5">
        <button onclick="renderLevel1()" class="px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-800/80 hover:bg-slate-700/80 text-slate-200 border border-slate-700 transition">
          Home
        </button>
        <a href="admin.html" class="px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold shadow-md shadow-emerald-500/20 transition flex items-center gap-1.5">
          <span>+</span> Editor
        </a>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="max-w-6xl w-full mx-auto px-4 lg:px-8 py-8 flex-1">

    <div class="text-center max-w-2xl mx-auto mb-8">
      <h2 id="page-heading" class="text-3xl lg:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-slate-400 tracking-tight mb-2">
        Explore Holy Texts
      </h2>
      <p id="page-subheading" class="text-xs lg:text-sm text-slate-400 font-normal">
        Hover over the 3D cards below to explore prophecies and comparative linguistics.
      </p>
    </div>

    <!-- Navigation & Big Easy Back Bar -->
    <div class="max-w-4xl mx-auto mb-8 flex items-center justify-between gap-3 bg-slate-900/60 backdrop-blur border border-slate-800 rounded-2xl p-3 px-4">
      <div id="breadcrumbs" class="flex items-center text-xs lg:text-sm text-slate-300 font-medium overflow-x-auto"></div>
      <button id="back-btn" onclick="goBackOneStep()" class="hidden text-xs font-bold text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3.5 py-1.5 rounded-xl transition flex items-center gap-1.5 shrink-0">
        ← Back
      </button>
    </div>

    <!-- 3D Cards Grid Container -->
    <div id="cards-container" class="flex flex-wrap justify-center items-center gap-8 py-4"></div>

  </main>

  <footer class="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
    <div class="max-w-6xl mx-auto px-4">
      Ahley Hadees Comparative Research Platform • 3D Studio Cards
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script>
    let allTopics = [];
    let currentSection = null;
    let currentCategory = null;

    const cardsContainer = document.getElementById('cards-container');
    const breadcrumbs = document.getElementById('breadcrumbs');
    const backBtn = document.getElementById('back-btn');
    const pageHeading = document.getElementById('page-heading');
    const pageSubheading = document.getElementById('page-subheading');

    document.addEventListener('DOMContentLoaded', async () => {
      allTopics = await getTopics();
      renderLevel1();
    });

    // Easy Back Navigation
    function goBackOneStep() {
      if (currentCategory) {
        selectSection(currentSection);
      } else if (currentSection) {
        renderLevel1();
      }
    }

    // LEVEL 1: QURAN & BIBLE (3D CARDS)
    function renderLevel1() {
      currentSection = null;
      currentCategory = null;
      backBtn.classList.add('hidden');
      
      pageHeading.textContent = "Explore Holy Texts";
      pageSubheading.textContent = "Choose a scripture to begin your comparative study.";

      breadcrumbs.innerHTML = `
        <span class="flex items-center gap-2 text-emerald-400 font-semibold">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          Main Library
        </span>
      `;

      cardsContainer.innerHTML = `
        <!-- QURAN 3D CARD -->
        <div class="parent" onclick="selectSection('Quran')">
          <div class="uiverse-card">
            <div class="logo">
              <span class="circle circle1"></span>
              <span class="circle circle2"></span>
              <span class="circle circle3"></span>
              <span class="circle circle4"></span>
              <span class="circle circle5"><span class="icon-inner">📖</span></span>
            </div>
            <div class="glass"></div>
            <div class="content">
              <span class="badge-tag">ISLAM</span>
              <span class="title">HOLY QURAN</span>
              <span class="text">Scientific revelations, cosmic expansion, and Tawheed verses analyzed with classical commentaries.</span>
            </div>
            <div class="bottom">
              <div class="social-buttons-container">
                <button class="social-button">📜</button>
                <button class="social-button">🔬</button>
              </div>
              <div class="view-more">
                <button class="view-more-button">Explore</button>
                <svg class="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
              </div>
            </div>
          </div>
        </div>

        <!-- BIBLE 3D CARD -->
        <div class="parent" onclick="selectSection('Bible')">
          <div class="uiverse-card theme-bible">
            <div class="logo">
              <span class="circle circle1"></span>
              <span class="circle circle2"></span>
              <span class="circle circle3"></span>
              <span class="circle circle4"></span>
              <span class="circle circle5"><span class="icon-inner">✝️</span></span>
            </div>
            <div class="glass"></div>
            <div class="content">
              <span class="badge-tag" style="color: #3730a3;">CHRISTIANITY</span>
              <span class="title">THE BIBLE</span>
              <span class="text">Old & New Testament prophecies, Hebrew/Greek roots, and comparative studies in Tamil.</span>
            </div>
            <div class="bottom">
              <div class="social-buttons-container">
                <button class="social-button">🕊️</button>
                <button class="social-button">🏛️</button>
              </div>
              <div class="view-more">
                <button class="view-more-button">Explore</button>
                <svg class="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // LEVEL 2: CATEGORIES (3D CARDS)
    function selectSection(section) {
      currentSection = section;
      currentCategory = null;
      backBtn.classList.remove('hidden');

      pageHeading.textContent = `${section} Categories`;
      pageSubheading.textContent = `Select a research category under ${section}.`;

      breadcrumbs.innerHTML = `
        <span onclick="renderLevel1()" class="hover:text-emerald-400 cursor-pointer transition">Home</span>
        <span class="mx-2 text-slate-600">/</span>
        <span class="text-emerald-400 font-bold">${section}</span>
      `;

      const categories = [...new Set(
        allTopics.filter(t => t.section === section).map(t => t.category)
      )];

      if (categories.length === 0) {
        cardsContainer.innerHTML = `
          <div class="bg-slate-900/60 p-8 rounded-2xl text-center border border-slate-800 max-w-md">
            <p class="text-slate-400 text-sm mb-4">No categories added in ${section} yet.</p>
            <a href="admin.html" class="inline-block bg-emerald-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs">+ Add Topic</a>
          </div>
        `;
        return;
      }

      cardsContainer.innerHTML = categories.map(cat => {
        const count = allTopics.filter(t => t.section === section && t.category === cat).length;
        return `
          <div class="parent" onclick="selectCategory('${cat}')">
            <div class="uiverse-card theme-category">
              <div class="logo">
                <span class="circle circle1"></span>
                <span class="circle circle2"></span>
                <span class="circle circle3"></span>
                <span class="circle circle4"></span>
                <span class="circle circle5"><span class="icon-inner">📁</span></span>
              </div>
              <div class="glass"></div>
              <div class="content">
                <span class="badge-tag" style="color:#9a3412;">CATEGORY</span>
                <span class="title">${cat}</span>
                <span class="text">Contains ${count} verified research chapters and comparative verse studies.</span>
              </div>
              <div class="bottom">
                <div class="social-buttons-container">
                  <button class="social-button">🔍</button>
                  <button class="social-button">📖</button>
                </div>
                <div class="view-more">
                  <button class="view-more-button">Open Topics</button>
                  <svg class="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // LEVEL 3: TOPICS (3D CARDS)
    function selectCategory(category) {
      currentCategory = category;
      backBtn.classList.remove('hidden');

      pageHeading.textContent = `${category} Studies`;
      pageSubheading.textContent = `Click any topic card to begin verse-by-verse analysis.`;

      breadcrumbs.innerHTML = `
        <span onclick="renderLevel1()" class="hover:text-emerald-400 cursor-pointer transition">Home</span>
        <span class="mx-2 text-slate-600">/</span>
        <span onclick="selectSection('${currentSection}')" class="hover:text-emerald-400 cursor-pointer transition">${currentSection}</span>
        <span class="mx-2 text-slate-600">/</span>
        <span class="text-indigo-400 font-bold">${category}</span>
      `;

      const filtered = allTopics.filter(t => t.section === currentSection && t.category === category);

      cardsContainer.innerHTML = filtered.map(item => `
        <div class="parent" onclick="openTopic('${item.id}')">
          <div class="uiverse-card theme-topic">
            <div class="logo">
              <span class="circle circle1"></span>
              <span class="circle circle2"></span>
              <span class="circle circle3"></span>
              <span class="circle circle4"></span>
              <span class="circle circle5"><span class="icon-inner">✨</span></span>
            </div>
            <div class="glass"></div>
            <div class="content">
              <span class="badge-tag" style="color:#4338ca;">${item.chapterRef || 'VERSE STUDY'}</span>
              <span class="title">${item.title}</span>
              <span class="text">${item.headerNote || 'Verse-by-verse comparison and model answers.'}</span>
            </div>
            <div class="bottom">
              <div class="social-buttons-container">
                <button class="social-button">✍️</button>
                <button class="social-button">💡</button>
              </div>
              <div class="view-more">
                <button class="view-more-button">Study</button>
                <svg class="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function openTopic(id) {
      window.location.href = `topic.html?id=${id}`;
    }
  </script>
</body>
</html>
