<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ahley Hadees — Comparative Research Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+Tamil:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: "Plus Jakarta Sans", "Noto Sans Tamil", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    .font-serif-title { font-family: "Cinzel", serif; }

    /* === REALISTIC 3D SACRED BOOK CSS === */
    .book-wrapper {
      perspective: 1200px;
      width: 260px;
      height: 370px;
      margin: 15px auto;
      cursor: pointer;
    }

    .book {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.6s ease;
      transform: rotateY(-18deg) rotateX(8deg);
      border-radius: 4px 14px 14px 4px;
    }

    .book-wrapper:hover .book,
    .book-wrapper:active .book {
      transform: rotateY(-5deg) rotateX(2deg) translateY(-8px) scale(1.03);
    }

    /* Hardcover Book Cover */
    .book-cover {
      position: absolute;
      inset: 0;
      border-radius: 4px 14px 14px 4px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backface-visibility: hidden;
      transform: translateZ(14px);
      box-shadow: 
        inset 4px 0 8px rgba(0,0,0,0.4),
        inset -2px 0 4px rgba(255,255,255,0.1),
        15px 20px 30px rgba(0,0,0,0.6);
    }

    /* Left Spine fold highlight */
    .book-cover::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 24px;
      background: linear-gradient(90deg, rgba(0,0,0,0.5) 0%, rgba(255,255,255,0.08) 60%, rgba(0,0,0,0.3) 100%);
      border-radius: 4px 0 0 4px;
    }

    /* 3D Paper Pages Thickness (Right edge) */
    .book-pages {
      position: absolute;
      top: 5px;
      bottom: 5px;
      right: -12px;
      width: 26px;
      background: repeating-linear-gradient(
        90deg,
        #fbf6ea 0px,
        #ede3cf 1px,
        #fbf6ea 2px
      );
      transform: rotateY(90deg);
      transform-origin: right center;
      border-radius: 0 4px 4px 0;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.3);
    }

    /* Quran Book Styling */
    .quran-theme {
      background: radial-gradient(circle at 50% 30%, #064e3b 0%, #022c22 75%, #011913 100%);
      border: 2px solid #d4af37;
    }
    .quran-border {
      border: 1.5px solid rgba(212, 175, 55, 0.4);
      outline: 1px dashed rgba(212, 175, 55, 0.6);
      outline-offset: -6px;
    }

    /* Bible Book Styling */
    .bible-theme {
      background: radial-gradient(circle at 50% 30%, #581c87 0%, #311042 75%, #1e052c 100%);
      border: 2px solid #e2b970;
    }
    .bible-border {
      border: 1.5px solid rgba(226, 185, 112, 0.4);
      outline: 1px dashed rgba(226, 185, 112, 0.6);
      outline-offset: -6px;
    }

    /* Category Book Styling */
    .category-theme {
      background: radial-gradient(circle at 50% 30%, #7c2d12 0%, #431407 80%, #270b04 100%);
      border: 2px solid #f59e0b;
    }

    /* Topic Chapter Styling */
    .topic-theme {
      background: radial-gradient(circle at 50% 30%, #1e3a8a 0%, #0f172a 80%, #020617 100%);
      border: 2px solid #60a5fa;
    }
  </style>
</head>
<body class="bg-[#070b14] text-slate-100 min-h-screen selection:bg-amber-500 selection:text-slate-950 flex flex-col justify-between">

  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[700px] h-[350px] bg-gradient-to-b from-amber-600/10 via-emerald-600/10 to-transparent blur-3xl rounded-full"></div>
    <div class="absolute bottom-0 right-0 w-[450px] h-[450px] bg-indigo-900/15 blur-3xl rounded-full"></div>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-40 border-b border-slate-800/80 bg-[#070b14]/85 backdrop-blur-xl px-4 lg:px-8 py-3.5">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-400 to-amber-200 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-amber-500/20 text-base shrink-0">AH</div>
        <div>
          <h1 class="text-sm lg:text-base font-extrabold tracking-tight text-white flex items-center gap-2">
            Ahley Hadees <span class="text-[10px] bg-amber-500/15 text-amber-300 font-bold px-2 py-0.5 rounded-full border border-amber-500/30">RESEARCH</span>
          </h1>
          <p class="text-[10px] text-slate-400 hidden sm:block">Comparative Religious Studies & Tamil Linguistic Verification</p>
        </div>
      </div>
      <button onclick="renderLevel1()" class="px-3 py-1.5 text-xs font-semibold rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 transition">Home</button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-6xl w-full mx-auto px-4 lg:px-8 py-6 lg:py-10 flex-1">
    
    <div class="text-center max-w-2xl mx-auto mb-8">
      <h2 id="page-heading" class="text-3xl sm:text-4xl lg:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-100 to-slate-200 font-serif-title tracking-wide mb-2">
        Explore Holy Texts
      </h2>
      <p id="page-subheading" class="text-xs sm:text-sm text-slate-400">
        வேத நூலைத் தேர்ந்தெடுத்து உங்கள் ஆய்வுப் பயணத்தைத் தொடங்குங்கள்.
      </p>
    </div>

    <!-- Breadcrumbs Navigation -->
    <div class="max-w-3xl mx-auto mb-8 flex items-center justify-between gap-2 bg-slate-900/60 backdrop-blur border border-slate-800/80 rounded-2xl p-2.5 px-4">
      <div id="breadcrumbs" class="flex items-center text-xs sm:text-sm text-slate-300 font-medium overflow-x-auto whitespace-nowrap"></div>
      <button id="back-btn" onclick="goBackOneStep()" class="hidden text-xs font-bold text-white bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 px-3.5 py-1.5 rounded-xl transition shrink-0">← Back</button>
    </div>

    <!-- Books Display Shelf Grid -->
    <div id="cards-container" class="flex flex-wrap items-center justify-center gap-10 sm:gap-14 py-4"></div>
  </main>

  <footer class="border-t border-slate-900 py-5 text-center text-xs text-slate-600">
    <div class="max-w-6xl mx-auto px-4">Ahley Hadees Research Library • 3D Sacred Book Edition</div>
  </footer>

  <script src="js/data.js"></script>
  <script>
    let allTopics = [];
    let currentSection = null;
    let currentCategory = null;

    const cardsContainer = document.getElementById("cards-container");
    const breadcrumbs = document.getElementById("breadcrumbs");
    const backBtn = document.getElementById("back-btn");
    const pageHeading = document.getElementById("page-heading");
    const pageSubheading = document.getElementById("page-subheading");

    document.addEventListener("DOMContentLoaded", async () => {
      allTopics = await getTopics();
      renderLevel1();
    });

    function goBackOneStep() {
      if (currentCategory) selectSection(currentSection);
      else if (currentSection) renderLevel1();
    }

    /* LEVEL 1: HOLY QURAN & THE BIBLE 3D BOOKS */
    function renderLevel1() {
      currentSection = null;
      currentCategory = null;
      backBtn.classList.add("hidden");
      pageHeading.textContent = "Explore Holy Texts";
      pageSubheading.textContent = "வேத நூலைத் தேர்ந்தெடுத்து உங்கள் ஆய்வுப் பயணத்தைத் தொடங்குங்கள்.";
      breadcrumbs.innerHTML = `<span class="flex items-center gap-1.5 text-amber-400 font-semibold"><span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>Main Sacred Library</span>`;

      cardsContainer.innerHTML = `
        <!-- 3D QURAN BOOK -->
        <div class="book-wrapper" onclick="selectSection('Quran')">
          <div class="book">
            <div class="book-pages"></div>
            <div class="book-cover quran-theme quran-border">
              <div class="flex justify-between items-start">
                <span class="text-[10px] font-bold text-amber-300/80 tracking-widest uppercase border border-amber-400/30 px-2 py-0.5 rounded">ISLAM</span>
                <span class="text-amber-400 text-lg font-serif">۞</span>
              </div>
              
              <div class="text-center my-auto py-2">
                <div class="w-14 h-14 mx-auto rounded-full border border-amber-400/40 flex items-center justify-center mb-3 bg-emerald-950/40 text-2xl shadow-inner">
                  📖
                </div>
                <h3 class="font-serif-title text-xl font-bold text-amber-200 tracking-wide leading-tight">
                  HOLY QURAN
                </h3>
                <p class="text-[11px] text-emerald-200/80 font-tamil mt-1 font-semibold">
                  திருக்குர்ஆன் ஆய்வுகள்
                </p>
                <div class="w-10 h-0.5 bg-gradient-to-r from-transparent via-amber-400 to-transparent mx-auto my-3"></div>
                <p class="text-[11px] text-slate-300 leading-relaxed line-clamp-3 font-normal px-1">
                  அறிவியல் சான்றுகள், பிரபஞ்ச விரிவாக்கம் மற்றும் ஓரிறைக் கொள்கை விளக்கங்கள்.
                </p>
              </div>

              <div class="pt-2 border-t border-amber-400/20 flex items-center justify-between text-[11px] font-bold text-amber-300">
                <span>திறக்க கிளிக் செய்க</span>
                <span>ஆராய் →</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 3D BIBLE BOOK -->
        <div class="book-wrapper" onclick="selectSection('Bible')">
          <div class="book">
            <div class="book-pages"></div>
            <div class="book-cover bible-theme bible-border">
              <div class="flex justify-between items-start">
                <span class="text-[10px] font-bold text-amber-200/80 tracking-widest uppercase border border-amber-300/30 px-2 py-0.5 rounded">CHRISTIANITY</span>
                <span class="text-amber-300 text-lg">✝</span>
              </div>
              
              <div class="text-center my-auto py-2">
                <div class="w-14 h-14 mx-auto rounded-full border border-amber-400/40 flex items-center justify-center mb-3 bg-purple-950/40 text-2xl shadow-inner">
                  📜
                </div>
                <h3 class="font-serif-title text-xl font-bold text-amber-100 tracking-wide leading-tight">
                  THE BIBLE
                </h3>
                <p class="text-[11px] text-purple-200/80 font-tamil mt-1 font-semibold">
                  பரிசுத்த வேதாகமம்
                </p>
                <div class="w-10 h-0.5 bg-gradient-to-r from-transparent via-amber-300 to-transparent mx-auto my-3"></div>
                <p class="text-[11px] text-slate-300 leading-relaxed line-clamp-3 font-normal px-1">
                  BSI, RC மற்றும் யெகோவா தமிழ் பதிப்புகளின் தீர்க்கதரிசன ஒப்பாய்வு.
                </p>
              </div>

              <div class="pt-2 border-t border-amber-300/20 flex items-center justify-between text-[11px] font-bold text-amber-200">
                <span>திறக்க கிளிக் செய்க</span>
                <span>ஆராய் →</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    /* LEVEL 2: CATEGORIES (Book Volumes) */
    function selectSection(section) {
      currentSection = section;
      currentCategory = null;
      backBtn.classList.remove("hidden");
      pageHeading.textContent = `${section} Categories`;
      pageSubheading.textContent = `${section} பிரிவின் கீழ் உள்ள ஆய்வுத் தொகுப்பைத் தேர்ந்தெடுக்கவும்.`;
      breadcrumbs.innerHTML = `<span onclick="renderLevel1()" class="hover:text-amber-400 cursor-pointer transition">Library</span><span class="mx-2 text-slate-600">/</span><span class="text-amber-400 font-bold">${section}</span>`;

      const categories = [...new Set(allTopics.filter(t => t.section === section).map(t => t.category))];
      if (categories.length === 0) {
        cardsContainer.innerHTML = `<div class="bg-slate-900/60 p-8 rounded-3xl text-center border border-slate-800 max-w-sm"><p class="text-slate-400 text-sm">No categories added yet.</p></div>`;
        return;
      }

      cardsContainer.innerHTML = categories.map(cat => {
        const count = allTopics.filter(t => t.section === section && t.category === cat).length;
        return `
          <div class="book-wrapper" onclick="selectCategory('${cat}')">
            <div class="book">
              <div class="book-pages"></div>
              <div class="book-cover category-theme border border-amber-500/50">
                <div class="flex justify-between items-start">
                  <span class="text-[10px] font-bold text-amber-300 tracking-wider uppercase border border-amber-500/30 px-2 py-0.5 rounded">VOLUME</span>
                  <span class="text-amber-400 font-mono text-xs font-bold">${count} தலைப்புகள்</span>
                </div>
                
                <div class="text-center my-auto py-2">
                  <div class="w-12 h-12 mx-auto rounded-full border border-amber-500/40 flex items-center justify-center mb-3 bg-amber-950/40 text-xl">
                    📁
                  </div>
                  <h3 class="text-lg font-bold text-white tracking-wide leading-tight">
                    ${cat}
                  </h3>
                  <div class="w-8 h-0.5 bg-amber-500/40 mx-auto my-3"></div>
                  <p class="text-[11px] text-slate-300">
                    சரிபார்க்கப்பட்ட வசனங்களின் ஒப்பாய்வு தொகுப்பு.
                  </p>
                </div>

                <div class="pt-2 border-t border-amber-500/20 flex items-center justify-between text-[11px] font-bold text-amber-300">
                  <span>தொகுப்பைத் திறக்க</span>
                  <span>வாசி →</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    /* LEVEL 3: CHAPTERS / TOPICS */
    function selectCategory(category) {
      currentCategory = category;
      backBtn.classList.remove("hidden");
      pageHeading.textContent = `${category} Studies`;
      pageSubheading.textContent = `ஆய்வு செய்ய வேண்டிய தலைப்பைத் தேர்ந்தெடுக்கவும்.`;
      breadcrumbs.innerHTML = `<span onclick="renderLevel1()" class="hover:text-amber-400 cursor-pointer transition">Library</span><span class="mx-2 text-slate-600">/</span><span onclick="selectSection('${currentSection}')" class="hover:text-amber-400 cursor-pointer transition">${currentSection}</span><span class="mx-2 text-slate-600">/</span><span class="text-indigo-400 font-bold">${category}</span>`;

      const filtered = allTopics.filter(t => t.section === currentSection && t.category === category);
      cardsContainer.innerHTML = filtered.map(item => `
        <div class="book-wrapper" onclick="openTopic('${item.id}')">
          <div class="book">
            <div class="book-pages"></div>
            <div class="book-cover topic-theme border border-blue-500/40">
              <div class="flex justify-between items-start">
                <span class="text-[10px] font-mono font-bold text-blue-300 border border-blue-400/30 px-2 py-0.5 rounded">${item.chapterRef || "CHAPTER"}</span>
                <span class="text-blue-400 text-xs">★</span>
              </div>
              
              <div class="text-center my-auto py-2">
                <div class="w-12 h-12 mx-auto rounded-full border border-blue-400/30 flex items-center justify-center mb-3 bg-blue-950/40 text-xl">
                  ✨
                </div>
                <h3 class="text-base font-bold text-white tracking-tight leading-snug line-clamp-2">
                  ${item.title}
                </h3>
                <div class="w-8 h-0.5 bg-blue-400/30 mx-auto my-3"></div>
                <p class="text-[11px] text-slate-300 line-clamp-3">
                  ${item.headerNote || "வசன ஆய்வு, எளிய தமிழ் மற்றும் வினா-விடை ஒப்பீடு."}
                </p>
              </div>

              <div class="pt-2 border-t border-blue-500/20 flex items-center justify-between text-[11px] font-bold text-blue-300">
                <span>ஆய்வு செய்க</span>
                <span>தொடங்கு →</span>
              </div>
            </div>
          </div>
        </div>
      `).join("");
    }

    function openTopic(id) {
      window.location.href = `topic.html?id=${id}`;
    }
  </script>
</body>
</html>
