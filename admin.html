<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Studio - Protected Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6 flex flex-col justify-center items-center">
  <div id="lock-screen" class="w-full max-w-sm bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl text-center">
    <div class="w-12 h-12 bg-indigo-600 text-white rounded-xl flex items-center justify-center mx-auto mb-4 text-xl font-bold">🔒</div>
    <h2 class="text-lg font-bold mb-1">Editor Access Required</h2>
    <p class="text-xs text-slate-400 mb-4">Please enter the security passkey to access the Research Editor.</p>
    <input type="password" id="pass-input" placeholder="Enter Password..." class="w-full p-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm mb-3 focus:outline-none focus:border-indigo-500 text-center">
    <button onclick="verifyPass()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl transition">Unlock Editor</button>
  </div>

  <div id="admin-panel" class="hidden w-full max-w-3xl bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl">
    <div class="flex items-center justify-between border-b border-slate-700 pb-4 mb-6">
      <div>
        <h2 class="text-lg sm:text-xl font-bold text-white">Ahley Hadees — Research Studio Editor</h2>
        <p class="text-xs text-slate-400">Add & configure multi-translation verses directly.</p>
      </div>
      <a href="index.html" class="text-xs font-bold text-indigo-400 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">Exit to Home</a>
    </div>

    <form id="admin-form" class="space-y-5">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Scripture Section</label>
          <select id="section" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-200">
            <option value="Bible">The Bible</option>
            <option value="Quran">Holy Quran</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Category Choice</label>
          <select id="category-select" onchange="toggleCustomCategory(this.value)" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-200">
            <option value="Prophecy">Prophecy (தீர்க்கதரிசனம்)</option>
            <option value="Science">Science (அறிவியல்)</option>
            <option value="Tawheed">Tawheed (ஓரிறைக்கொள்கை)</option>
            <option value="Jesus">Jesus (ஈஸா நபி ஆய்வு)</option>
            <option value="__custom__">+ Add New Category...</option>
          </select>
          <input type="text" id="custom-category" placeholder="Type new category..." class="hidden mt-2 w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-200">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Topic Title</label>
          <input type="text" id="title" placeholder="Topic 2: ..." required class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-200">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Chapter / Verse Reference</label>
          <input type="text" id="chapterRef" placeholder="எ.கா: மத்தேயு 2:1-12" required class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-200">
        </div>
      </div>

      <div class="border-t border-slate-700 pt-5">
        <div class="flex items-center justify-between mb-3">
          <label class="text-sm font-bold text-indigo-400">Verses Chain Studio</label>
          <button type="button" onclick="addVerseCard()" class="text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg transition">+ Add Another Verse</button>
        </div>
        <div id="verses-box" class="space-y-5"></div>
      </div>

      <div class="pt-4 flex flex-col sm:flex-row gap-3">
        <button type="submit" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 font-bold text-white text-xs rounded-xl shadow transition">💾 Save Topic Directly to Disk</button>
        <button type="button" onclick="exportJsonFile()" class="py-3 px-5 bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold text-xs rounded-xl transition">⬇️ Export topics.json</button>
      </div>
    </form>
  </div>

  <script src="js/data.js"></script>
  <script>
    let verseCount = 0;
    function verifyPass() {
      const val = document.getElementById("pass-input").value;
      if (val === "786") {
        document.getElementById("lock-screen").classList.add("hidden");
        document.getElementById("admin-panel").classList.remove("hidden");
      } else {
        alert("❌ Invalid Passkey! Access Denied.");
      }
    }

    function toggleCustomCategory(val) {
      const customInput = document.getElementById("custom-category");
      if (val === "__custom__") {
        customInput.classList.remove("hidden");
        customInput.focus();
      } else {
        customInput.classList.add("hidden");
      }
    }

    function addVerseCard() {
      verseCount++;
      const div = document.createElement("div");
      div.className = "p-4 bg-slate-900/80 border border-slate-700 rounded-2xl space-y-3 relative";
      div.id = `verse-block-${verseCount}`;
      div.innerHTML = `
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <span class="text-xs font-bold text-indigo-400">Verse Block #${verseCount}</span>
          <button type="button" onclick="removeVerseCard(${verseCount})" class="text-xs text-rose-400 hover:underline">Remove</button>
        </div>
        <input type="text" placeholder="Verse Reference (மத்தேயு 1:18)" class="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-xs v-ref text-slate-200" required>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <textarea rows="3" placeholder="1. BSI / Protestant Tamil..." class="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-xs v-bsi text-slate-200" required></textarea>
          <textarea rows="3" placeholder="2. RC / Catholic Tamil..." class="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-xs v-rc text-slate-200"></textarea>
          <textarea rows="3" placeholder="3. Jehovah / NWT Tamil..." class="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-xs v-jw text-slate-200"></textarea>
        </div>
        <textarea rows="2" placeholder="Modern Tamil Explanation..." class="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-xs v-modern text-slate-200"></textarea>
        <input type="text" placeholder="Research Question (கேள்வி)..." class="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-xs v-question text-slate-200" required>
        <textarea rows="2" placeholder="Model Answer (பதில் - விருப்பத்திற்குரியது)..." class="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-xs v-answer text-slate-200"></textarea>
      `;
      document.getElementById("verses-box").appendChild(div);
    }

    function removeVerseCard(num) {
      const el = document.getElementById(`verse-block-${num}`);
      if (el) el.remove();
    }
    addVerseCard();

    document.getElementById("admin-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const selectVal = document.getElementById("category-select").value;
      const category = (selectVal === "__custom__") ? document.getElementById("custom-category").value.trim() : selectVal;

      const blocks = document.querySelectorAll("#verses-box > div");
      const verses = [];
      blocks.forEach(b => {
        verses.push({
          verseNum: b.querySelector(".v-ref").value.trim(),
          bsiTamil: b.querySelector(".v-bsi").value.trim(),
          rcTamil: b.querySelector(".v-rc").value.trim(),
          jwTamil: b.querySelector(".v-jw").value.trim(),
          modern: b.querySelector(".v-modern").value.trim(),
          question: b.querySelector(".v-question").value.trim(),
          defaultAnswer: b.querySelector(".v-answer").value.trim()
        });
      });

      const newTopic = {
        id: `topic-${Date.now()}`,
        section: document.getElementById("section").value,
        category: category,
        title: document.getElementById("title").value.trim(),
        chapterRef: document.getElementById("chapterRef").value.trim(),
        headerNote: "ஒவ்வொரு வசனத்திற்கும் BSI, RC, யெகோவா பதிப்புகள் மற்றும் வினா-விடை ஒப்பீடு.",
        verses: verses
      };

      try {
        const res = await fetch("/api/save-topic", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(newTopic)
        });
        if (res.ok) {
          alert("✅ Topic Seedha data/topics.json file me save ho gaya!");
          localStorage.removeItem("ahley_hadees_topics");
          window.location.href = "index.html";
          return;
        }
      } catch (err) {}

      const topics = await getTopics();
      topics.push(newTopic);
      localStorage.setItem("ahley_hadees_topics", JSON.stringify(topics));
      alert("⚠️ Local Storage me save hua. Export topics.json dabayein.");
    });

    async function exportJsonFile() {
      const topics = await getTopics();
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(topics, null, 2));
      const dlAnchor = document.createElement("a");
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", "topics.json");
      dlAnchor.click();
    }
  </script>
</body>
</html>
