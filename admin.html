<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Research Editor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Ahley Hadees — Research Editor</h1>
    <div class="nav-links">
      <a href="index.html">View Site</a>
    </div>
  </header>

  <div class="container">
    <div class="study-box">
      <h2>Add New Research Topic</h2>
      <br>
      <form id="topic-form">
        <div class="form-group">
          <label>Step 1: Research Section</label>
          <select id="section" required>
            <option value="Quran">Quran</option>
            <option value="Bible">Bible</option>
          </select>
        </div>

        <div class="form-group">
          <label>Step 2: Category / Chapter (e.g., Prophecy, Science, Tawheed)</label>
          <input type="text" id="category" placeholder="Prophecy" required>
        </div>

        <div class="form-group">
          <label>Step 3: Topic Title</label>
          <input type="text" id="title" placeholder="Prophecy 1: A Prophet Like Moses" required>
        </div>

        <div class="form-group">
          <label>Verse Reference</label>
          <input type="text" id="verseRef" placeholder="Deuteronomy 18:18" required>
        </div>

        <div class="form-group">
          <label>Biblical / Classical Tamil Text</label>
          <textarea id="classicalTamil" rows="3" placeholder="பழைய தமிழ் வாசகம்..."></textarea>
        </div>

        <div class="form-group">
          <label>Modern Tamil Explanation</label>
          <textarea id="modernTamil" rows="3" placeholder="நவீன தமிழ் விளக்கம்..."></textarea>
        </div>

        <div class="form-group">
          <label>Research Question</label>
          <input type="text" id="question" placeholder="Does this verse refer to..." required>
        </div>

        <div class="form-group">
          <label>Answer</label>
          <textarea id="answer" rows="4" placeholder="Detailed comparative answer..." required></textarea>
        </div>

        <div class="form-group">
          <label>Sources / References</label>
          <input type="text" id="sources" placeholder="Tafsir, Books, Hadith references">
        </div>

        <button type="submit" class="btn-primary">Save Research Data</button>
        <button type="button" class="btn-primary" style="background: #475569; margin-left: 10px;" id="export-btn">Export topics.json</button>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
