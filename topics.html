<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050811">
<title>Research Topics — Ahley Hadees</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+Tamil:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{font-family:"Plus Jakarta Sans","Noto Sans Tamil",sans-serif;-webkit-tap-highlight-color:transparent;background:#050811;color:#f1f5f9;overflow-x:hidden}.font-serif-title{font-family:"Cinzel",serif}
.parent-3d{perspective:1000px;cursor:pointer}.card-3d-tilt{position:relative;padding-top:42px;border:2px solid rgba(255,255,255,.15);border-radius:20px;transform-style:preserve-3d;background:linear-gradient(135deg,rgba(255,255,255,.02) 18.75%,rgba(15,23,42,.85) 0 31.25%,rgba(255,255,255,.02) 0),repeating-linear-gradient(45deg,rgba(15,23,42,.6) -6.25% 6.25%,rgba(30,41,59,.7) 0 18.75%);background-size:50px 50px;background-color:#0f172a;box-shadow:0 25px 40px -15px rgba(0,0,0,.9);transition:transform .3s,border-color .3s,box-shadow .3s}
.parent-3d:hover .card-3d-tilt{transform:translateY(-4px);border-color:rgba(99,102,241,.65);box-shadow:0 30px 50px -10px rgba(79,70,229,.3)}.content-box-3d{background:linear-gradient(180deg,rgba(30,41,59,.9),rgba(15,23,42,.97));border-radius:0 0 18px 18px;padding:22px 18px 18px;border-top:1px solid rgba(255,255,255,.1)}.card-title-3d{display:block;color:#fff;font-size:17px;font-weight:800;line-height:1.4;overflow-wrap:anywhere}.card-content-3d{margin-top:10px;font-size:12px;color:#cbd5e1;line-height:1.6;overflow-wrap:anywhere}.btn-3d{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12px;color:#fff;background:linear-gradient(135deg,#4f46e5,#3730a3);padding:.6rem .9rem;border-radius:12px;box-shadow:0 4px 12px rgba(79,70,229,.35)}.badge-3d{position:absolute;top:14px;right:14px;background:#020617;border:1.5px solid #6366f1;border-radius:14px;padding:4px 9px;text-align:center}.badge-3d span{display:block}button:focus-visible,a:focus-visible{outline:2px solid #fbbf24;outline-offset:3px}
</style>
</head>
<body class="min-h-screen flex flex-col">
<div class="fixed inset-0 overflow-hidden pointer-events-none -z-10"><div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[750px] h-[380px] bg-indigo-600/10 blur-3xl rounded-full"></div><div class="absolute bottom-0 right-0 w-[450px] h-[450px] bg-red-950/20 blur-3xl rounded-full"></div></div>
<header class="sticky top-0 z-40 border-b border-slate-800/80 bg-[#050811]/95 backdrop-blur-xl px-4 lg:px-8 py-3.5">
<div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
<a href="index.html" class="flex items-center gap-3 min-w-0"><div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-400 to-amber-200 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-amber-500/20 shrink-0">AH</div><h1 class="text-sm lg:text-base font-extrabold text-white">Ahley Hadees <span class="text-[10px] bg-amber-500/15 text-amber-300 px-2 py-0.5 rounded-full border border-amber-500/30">RESEARCH</span></h1></a>
<button id="back-top" class="px-3.5 py-2 text-xs font-bold rounded-xl bg-slate-900 text-slate-300 border border-slate-800">← Back to Categories</button>
</div></header>
<main class="max-w-6xl w-full mx-auto px-4 lg:px-8 py-6 lg:py-10 flex-1">
<div class="max-w-2xl mx-auto text-center mb-6">
<h2 id="section-title" class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-white to-slate-200 font-serif-title tracking-wide mb-2">Research Topics</h2>
<p id="section-subtitle" class="text-xs sm:text-sm text-slate-400 mb-6">ஆய்வு செய்ய வேண்டிய தலைப்பைத் தேர்ந்தெடுக்கவும்.</p>
<div class="relative max-w-md mx-auto"><input type="search" id="search-input" placeholder="Search topic or reference..." class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl px-4 py-3 pl-10 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"><span class="absolute left-3.5 top-3 text-slate-500">🔍</span></div>
</div>
<div class="max-w-xl mx-auto mb-6 flex items-center justify-between gap-2 bg-slate-900/60 border border-slate-800/80 rounded-2xl p-3 px-4 text-xs">
<div class="text-slate-300 whitespace-nowrap overflow-x-auto"><a href="index.html">Library</a><span class="mx-2 text-slate-600">/</span><a id="crumb-section-link" href="categories.html"><span id="crumb-section"></span></a><span class="mx-2 text-slate-600">/</span><span id="crumb-cat" class="text-indigo-400 font-bold"></span></div>
<button id="back-btn" class="text-xs font-bold text-white bg-slate-800 border border-slate-700 px-3 py-2 rounded-xl shrink-0">← Back</button></div>
<div class="flex items-center justify-between max-w-5xl mx-auto mb-4 px-2 text-xs text-slate-400 gap-3"><span id="topics-counter" class="font-semibold text-indigo-400">Loading topics...</span><span class="text-[11px] bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-lg">Research Library</span></div>
<div id="load-error" class="hidden max-w-xl mx-auto mb-5 rounded-xl border border-rose-900 bg-rose-950/30 p-4 text-sm text-rose-200"></div>
<div id="topics-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8 py-2 max-w-5xl mx-auto"></div>
</main>
<footer class="border-t border-slate-900 py-5 text-center text-xs text-slate-600">Ahley Hadees Research Library • Scripture Research Topics</footer>
<script>
(() => {
"use strict";
const DATA_URL="data/topics.json", STORAGE_KEY="ahley_hadees_topics_v2";
const $=id=>document.getElementById(id), params=new URLSearchParams(location.search);
const sectionParam=params.get("section")||"Bible", category=(params.get("category")||"Prophecy").trim();
const section=["Quran","Bible"].find(s=>s.toLowerCase()===sectionParam.toLowerCase())||"Bible";
const backUrl="categories.html?section="+encodeURIComponent(section);
let targetTopics=[];
$("back-top").onclick=()=>location.href=backUrl;
$("back-btn").onclick=()=>location.href=backUrl;
$("crumb-section-link").href=backUrl;
$("crumb-section").textContent=section;
$("crumb-cat").textContent=category;
$("section-title").textContent=category+" Topics";
$("section-subtitle").textContent=section+" • "+category+" தொகுப்பின் கீழ் உள்ள ஆய்வுத் தலைப்புகள்.";
$("search-input").placeholder=section==="Quran"?"Search topic or Surah/Ayah reference...":"Search topic or Bible reference (எ.கா: மத்தேயு)...";

function localTopics(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");return Array.isArray(v)?v:[]}catch(_){return[]}}
async function loadTopics(){
 let published=[];
 try{const r=await fetch(DATA_URL,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const d=await r.json();if(Array.isArray(d))published=d}
 catch(_){$("load-error").textContent="data/topics.json load nahi hua. GitHub repository ke data folder aur JSON syntax check karein.";$("load-error").classList.remove("hidden")}
 const merged=[...published], ids=new Set(merged.map(t=>t&&t.id).filter(Boolean));
 localTopics().forEach(t=>{if(t&&t.id&&!ids.has(t.id)){merged.push(t);ids.add(t.id)}});
 return merged.filter(t=>t&&typeof t==="object")
}
function references(t){const out=[];if(t.reference)out.push(t.reference);if(t.chapterRef)out.push(t.chapterRef);if(Array.isArray(t.passages))t.passages.forEach(p=>{if(p&&p.reference)out.push(p.reference)});if(Array.isArray(t.verses))t.verses.forEach(v=>{if(v&&v.verseNum)out.push(v.verseNum)});return [...new Set(out)]}
function description(t){return t.description||t.headerNote||t.explanation||"ஒவ்வொரு வசனத்திற்கும் எளிய தமிழ் விளக்கம் மற்றும் ஆய்வு வினா-விடைகள்."}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function openTopic(t){location.href="reader.html?id="+encodeURIComponent(t.id)}
function render(items){
 $("topics-counter").textContent="காண்பிக்கப்படும் தலைப்புகள்: "+items.length;
 const grid=$("topics-grid");grid.replaceChildren();
 if(!items.length){const empty=el("div","text-center py-12 col-span-full"),box=el("div","bg-slate-900/60 p-8 rounded-3xl border border-slate-800 max-w-sm mx-auto");box.append(el("p","text-slate-300 text-sm font-bold","தலைப்புகள் எதுவும் கிடைக்கவில்லை."),el("p","text-slate-500 text-xs mt-2","இந்த category-க்கு admin editor மூலம் topic சேர்க்கவும்."));empty.append(box);grid.append(empty);return}
 items.forEach((t,i)=>{
  const btn=el("button","parent-3d text-left w-full");btn.type="button";btn.setAttribute("aria-label","Open topic: "+(t.title||"Research topic"));btn.onclick=()=>openTopic(t);
  const outer=el("div","card-3d-tilt h-full"),badge=el("div","badge-3d");
  badge.append(el("span","text-[9px] font-bold text-indigo-400 uppercase tracking-wider","TOPIC"),el("span","text-sm font-black text-white font-mono","#"+(i+1)));
  const content=el("div","content-box-3d h-full"),refs=references(t);
  content.append(el("span","text-[10px] font-mono font-bold text-indigo-300 bg-indigo-500/10 border border-indigo-500/20 px-2 py-1 rounded-md inline-block mb-3",refs.length?refs.join(" • "):"REFERENCE NOT ADDED"));
  content.append(el("h3","card-title-3d min-h-[44px]",t.title||"Untitled Research Topic"));
  content.append(el("p","card-content-3d min-h-[55px]",description(t)));
  const foot=el("div","flex items-center justify-between gap-2 mt-4 pt-3 border-t border-slate-800/80");
  const count=Array.isArray(t.passages)?t.passages.length:Array.isArray(t.verses)?t.verses.length:0;
  foot.append(el("span","text-[10px] text-emerald-400 font-bold",count+" verse"+(count===1?"":"s")),el("span","btn-3d","ஆராய் →"));
  content.append(foot);outer.append(badge,content);btn.append(outer);grid.append(btn)
 })
}
function searchTopics(){const q=$("search-input").value.trim().toLocaleLowerCase();render(targetTopics.filter(t=>[t.title||"",t.description||"",t.headerNote||"",t.explanation||"",references(t).join(" "),t.category||"",t.section||""].join(" ").toLocaleLowerCase().includes(q)))}
async function start(){const all=await loadTopics();targetTopics=all.filter(t=>String(t.section||"").toLowerCase()===section.toLowerCase()&&String(t.category||"").toLowerCase()===category.toLowerCase());render(targetTopics);$("search-input").addEventListener("input",searchTopics)}
start();
})();
</script>
</body>
</html>
